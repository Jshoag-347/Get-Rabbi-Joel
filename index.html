<!-- file: index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2048 Classroom Project</title>
  <style>
    :root { --gap: 12px; --size: 92px; --radius: 14px; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #faf8ef; color: #776e65;
      display: flex; justify-content: center; padding: 24px;
    }
    .wrap { width: min(420px, 100%); }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 56px; line-height: 1; letter-spacing: -1px; color: #776e65; }
    .scores { display: flex; gap: 10px; }
    .badge {
      background: #bbada0; color: #f9f6f2; padding: 10px 12px; border-radius: 10px;
      min-width: 92px; text-align: center; user-select: none;
    }
    .badge .label { font-size: 12px; opacity: 0.9; }
    .badge .val { font-size: 22px; font-weight: 700; margin-top: 2px; }
    .sub { margin: 14px 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px;}
    .hint { font-size: 14px; color: #776e65; }
    button {
      border: 0; background: #8f7a66; color: #f9f6f2;
      padding: 10px 12px; border-radius: 10px; font-weight: 700;
      cursor: pointer;
    }
    button:active { transform: translateY(1px); }

    .board {
      position: relative;
      background: #bbada0; border-radius: var(--radius);
      padding: var(--gap);
      touch-action: none;
      user-select: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, var(--size));
      grid-template-rows: repeat(4, var(--size));
      gap: var(--gap);
      justify-content: center;
    }
    .cell {
      background: rgba(238,228,218,0.35);
      border-radius: 12px;
    }
    .tile-layer {
      position: absolute; inset: var(--gap);
      display: grid;
      grid-template-columns: repeat(4, var(--size));
      grid-template-rows: repeat(4, var(--size));
      gap: var(--gap);
      pointer-events: none;
    }
    .tile {
      border-radius: 12px;
      display: grid; place-items: center;
      font-weight: 800;
      transform: scale(1);
      animation: pop 120ms ease-out;

      /* image tile rules */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    @keyframes pop { from { transform: scale(0.88);} to { transform: scale(1);} }

    .overlay {
      position: absolute; inset: 0;
      display: none;
      align-items: center; justify-content: center;
      background: rgba(238,228,218,0.73);
      border-radius: var(--radius);
      text-align: center;
      padding: 20px;
    }
    .overlay.show { display: flex; }
    .panel {
      background: rgba(255,255,255,0.85);
      padding: 18px 16px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.10);
      max-width: 320px;
    }
    .panel h2 { margin: 0 0 8px; font-size: 28px; }
    .panel p { margin: 0 0 12px; font-size: 14px; }
    .panel .row { display: flex; justify-content: center; gap: 10px; }

    @media (max-width: 420px) {
      :root { --gap: 10px; --size: 76px; }
      h1 { font-size: 48px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>2048</h1>
      <div class="scores">
        <div class="badge">
          <div class="label">SCORE</div>
          <div class="val" id="score">0</div>
        </div>
        <div class="badge">
          <div class="label">BEST</div>
          <div class="val" id="best">0</div>
        </div>
      </div>
    </header>

    <div class="sub">
      <div class="hint">Use <b>arrow keys</b> / <b>WASD</b> or swipe.</div>
      <button id="restart" type="button">Restart</button>
    </div>

    <div class="board" id="board" aria-label="2048 board">
      <div class="grid" aria-hidden="true" id="bg"></div>
      <div class="tile-layer" id="tiles"></div>

      <div class="overlay" id="overlay" role="dialog" aria-modal="true">
        <div class="panel">
          <h2 id="overTitle">Game over!</h2>
          <p id="overMsg">No more moves. Try again?</p>
          <div class="row">
            <button id="tryAgain" type="button">Try again</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/**
 * 2048 (image tiles)
 * Put your images in: /images/<value>.png
 */

const SIZE = 4;
const BEST_KEY = "bestScore_2048_class";

/* Your requested mapping:
   512=first, 1024=second, 256=third, 64=fourth, 128=fifth,
   32=sixth, 2048=seventh, 2=eighth, 4=ninth, 16=tenth, 8=eleventh
*/
const TILE_IMAGES = {
  2: "images/2.jpg",
  4: "images/4.jpg",
  8: "images/8.jpg",
  16: "images/16.jpg",
  32: "images/32.jpg",
  64: "images/64.jpg",
  128: "images/128.jpg",
  256: "images/256.jpg",
  512: "images/512.jpg",
  1024: "images/1024.jpg",
  2048: "images/2048.jpg",
};

const els = {
  score: document.getElementById("score"),
  best: document.getElementById("best"),
  restart: document.getElementById("restart"),
  bg: document.getElementById("bg"),
  tiles: document.getElementById("tiles"),
  overlay: document.getElementById("overlay"),
  tryAgain: document.getElementById("tryAgain"),
  board: document.getElementById("board"),
  overTitle: document.getElementById("overTitle"),
  overMsg: document.getElementById("overMsg"),
};

let grid = makeEmptyGrid();
let score = 0;
let best = loadBest();
let gameOver = false;

initBackground();
resetGame();

function initBackground() {
  els.bg.innerHTML = "";
  for (let i = 0; i < SIZE * SIZE; i++) {
    const d = document.createElement("div");
    d.className = "cell";
    els.bg.appendChild(d);
  }
}

function resetGame() {
  grid = makeEmptyGrid();
  score = 0;
  gameOver = false;
  hideOverlay();

  spawnRandomTile(grid);
  spawnRandomTile(grid);

  render();
}

function makeEmptyGrid() {
  return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
}

function cloneGrid(g) {
  return g.map(row => row.slice());
}

function loadBest() {
  const v = Number(localStorage.getItem(BEST_KEY) || "0");
  return Number.isFinite(v) ? v : 0;
}

function saveBest(v) {
  localStorage.setItem(BEST_KEY, String(v));
}

function emptyCells(g) {
  const out = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (g[r][c] === 0) out.push([r, c]);
    }
  }
  return out;
}

function spawnRandomTile(g) {
  const empties = emptyCells(g);
  if (empties.length === 0) return false;
  const [r, c] = empties[Math.floor(Math.random() * empties.length)];
  g[r][c] = Math.random() < 0.9 ? 2 : 4;
  return true;
}

function gridsEqual(a, b) {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (a[r][c] !== b[r][c]) return false;
    }
  }
  return true;
}

function anyMovesLeft(g) {
  if (emptyCells(g).length > 0) return true;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const v = g[r][c];
      if (r + 1 < SIZE && g[r + 1][c] === v) return true;
      if (c + 1 < SIZE && g[r][c + 1] === v) return true;
    }
  }
  return false;
}

function slideAndMergeLine(line) {
  const nonZero = line.filter(v => v !== 0);
  const merged = [];
  let gained = 0;

  for (let i = 0; i < nonZero.length; i++) {
    const cur = nonZero[i];
    const next = nonZero[i + 1];
    if (next !== undefined && cur === next) {
      const nv = cur * 2;
      merged.push(nv);
      gained += nv;
      i++;
    } else {
      merged.push(cur);
    }
  }

  while (merged.length < SIZE) merged.push(0);
  return { line: merged, gained };
}

function move(direction) {
  if (gameOver) return;

  const before = cloneGrid(grid);
  let gainedTotal = 0;

  if (direction === "left" || direction === "right") {
    for (let r = 0; r < SIZE; r++) {
      const row = grid[r].slice();
      const working = direction === "right" ? row.reverse() : row;
      const { line, gained } = slideAndMergeLine(working);
      gainedTotal += gained;
      const out = direction === "right" ? line.reverse() : line;
      grid[r] = out;
    }
  } else {
    for (let c = 0; c < SIZE; c++) {
      const col = [];
      for (let r = 0; r < SIZE; r++) col.push(grid[r][c]);
      const working = direction === "down" ? col.reverse() : col;
      const { line, gained } = slideAndMergeLine(working);
      gainedTotal += gained;
      const out = direction === "down" ? line.reverse() : line;
      for (let r = 0; r < SIZE; r++) grid[r][c] = out[r];
    }
  }

  if (gridsEqual(before, grid)) return;

  score += gainedTotal;
  if (score > best) {
    best = score;
    saveBest(best);
  }

  spawnRandomTile(grid);
  render();

  if (!anyMovesLeft(grid)) {
    gameOver = true;
    showOverlay("Game over!", "No more moves. Try again?");
  }
}

function render() {
  els.score.textContent = String(score);
  els.best.textContent = String(best);

  els.tiles.innerHTML = "";

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const v = grid[r][c];
      if (v === 0) continue;

      const tile = document.createElement("div");
      tile.className = "tile";
      tile.style.gridRowStart = String(r + 1);
      tile.style.gridColumnStart = String(c + 1);

      const img = TILE_IMAGES[v];
      if (img) {
        tile.style.backgroundImage = `url("${img}")`;
        tile.textContent = "";
        tile.setAttribute("aria-label", String(v));
      } else {
        tile.textContent = String(v);
      }

      els.tiles.appendChild(tile);
    }
  }
}

function showOverlay(title, msg) {
  els.overTitle.textContent = title;
  els.overMsg.textContent = msg;
  els.overlay.classList.add("show");
}

function hideOverlay() {
  els.overlay.classList.remove("show");
}

document.addEventListener("keydown", (e) => {
  const key = e.key.toLowerCase();
  const map = {
    arrowleft: "left",
    a: "left",
    arrowright: "right",
    d: "right",
    arrowup: "up",
    w: "up",
    arrowdown: "down",
    s: "down",
  };
  const dir = map[key];
  if (!dir) return;
  e.preventDefault();
  move(dir);
});

els.restart.addEventListener("click", resetGame);
els.tryAgain.addEventListener("click", resetGame);

let touchStart = null;

els.board.addEventListener("touchstart", (e) => {
  if (!e.touches || e.touches.length !== 1) return;
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });

els.board.addEventListener("touchend", (e) => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  touchStart = null;

  const absX = Math.abs(dx);
  const absY = Math.abs(dy);
  const THRESH = 24;
  if (Math.max(absX, absY) < THRESH) return;

  if (absX > absY) move(dx > 0 ? "right" : "left");
  else move(dy > 0 ? "down" : "up");
}, { passive: true });
</script>
</body>
</html>
