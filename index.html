<!-- file: index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Get Rabbi Joel</title>

  <style>
    :root { --gap: 12px; --size: 92px; --radius: 14px; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #faf8ef;
      color: #776e65;
      display: flex;
      justify-content: center;
      padding: 24px;
    }

    .wrap { width: min(420px, 100%); }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 56px;
      line-height: 1;
      letter-spacing: -1px;
      color: #776e65;
    }

    .scores { display: flex; gap: 10px; }

    .badge {
      background: #bbada0;
      color: #f9f6f2;
      padding: 10px 12px;
      border-radius: 10px;
      min-width: 92px;
      text-align: center;
      user-select: none;
    }

    .badge .label { font-size: 12px; opacity: 0.9; }
    .badge .val { font-size: 22px; font-weight: 700; margin-top: 2px; }

    .sub {
      margin: 14px 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .hint { font-size: 14px; color: #776e65; }

    button {
      border: 0;
      background: #8f7a66;
      color: #f9f6f2;
      padding: 10px 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active { transform: translateY(1px); }

    .board {
      position: relative;
      background: #bbada0;
      border-radius: var(--radius);
      padding: var(--gap);
      touch-action: none;
      user-select: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, var(--size));
      grid-template-rows: repeat(4, var(--size));
      gap: var(--gap);
      justify-content: center;
    }

    .cell {
      background: rgba(238,228,218,0.35);
      border-radius: 12px;
    }

    .tile-layer {
      position: absolute;
      inset: var(--gap);
      pointer-events: none;
    }

    .tile {
      position: absolute;
      width: var(--size);
      height: var(--size);
      border-radius: 12px;

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: grid;
      place-items: center;
      font-weight: 800;
      color: #776e65;
      font-size: 32px;
      background-color: #eee4da;

      /* Position via CSS variables so pop animation never overwrites translate */
      --tx: 0px;
      --ty: 0px;
      transform: translate(var(--tx), var(--ty));

      /* Slide animation */
      transition: transform 120ms ease-in-out;
      will-change: transform;
    }

    .tile.is-new { animation: pop 140ms ease-out; }
    .tile.is-merged { animation: pop 140ms ease-out; }

    @keyframes pop {
      from { transform: translate(var(--tx), var(--ty)) scale(0.88); }
      to   { transform: translate(var(--tx), var(--ty)) scale(1); }
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(238,228,218,0.73);
      border-radius: var(--radius);
      text-align: center;
      padding: 20px;
      pointer-events: auto;
    }

    .overlay.show { display: flex; }

    .panel {
      background: rgba(255,255,255,0.85);
      padding: 18px 16px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.10);
      max-width: 320px;
      pointer-events: auto;
    }

    .panel h2 { margin: 0 0 8px; font-size: 28px; }
    .panel p { margin: 0 0 12px; font-size: 14px; }
    .panel .row { display: flex; justify-content: center; gap: 10px; }

    @media (max-width: 420px) {
      :root { --gap: 10px; --size: 76px; }
      h1 { font-size: 48px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>Get Rabbi Joel</h1>
      <div class="scores">
        <div class="badge">
          <div class="label">SCORE</div>
          <div class="val" id="score">0</div>
        </div>
        <div class="badge">
          <div class="label">BEST</div>
          <div class="val" id="best">0</div>
        </div>
      </div>
    </header>

    <div class="sub">
      <div class="hint">Use <b>arrow keys</b> / <b>WASD</b> or swipe.</div>
      <button id="restart" type="button">Restart</button>
    </div>

    <div class="board" id="board" aria-label="2048 board">
      <div class="grid" aria-hidden="true" id="bg"></div>
      <div class="tile-layer" id="tiles"></div>

      <div class="overlay" id="overlay" role="dialog" aria-modal="true">
        <div class="panel">
          <h2 id="overTitle">Game over!</h2>
          <p id="overMsg">No more moves. Try again?</p>
          <div class="row">
            <button id="tryAgain" type="button">Try again</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/**
 * 2048 with image tiles + smooth slide animation (no transform conflicts).
 *
 * Images:
 *   Put files in /images and name them by value:
 *     images/2.jpg (or .png/.jpeg), images/4.jpg, ... images/2048.jpg
 *
 * The renderer tries png -> jpg -> jpeg automatically.
 */

const SIZE = 4;
const BEST_KEY = "bestScore_2048_class";

/* ---------- DOM ---------- */
const els = {
  score: document.getElementById("score"),
  best: document.getElementById("best"),
  restart: document.getElementById("restart"),
  bg: document.getElementById("bg"),
  tiles: document.getElementById("tiles"),
  overlay: document.getElementById("overlay"),
  tryAgain: document.getElementById("tryAgain"),
  board: document.getElementById("board"),
  overTitle: document.getElementById("overTitle"),
  overMsg: document.getElementById("overMsg"),
};

/* ---------- State ---------- */
let score = 0;
let best = loadBest();
let gameOver = false;
let hasWon = false;

let nextTileId = 1;
/** @type {(null|{id:number,value:number,flags:{isNew:boolean,isMerged:boolean}})[][]} */
let grid = makeEmptyGrid();

/** @type {Map<number, HTMLDivElement>} */
const tileEls = new Map();

/* ---------- Init ---------- */
initBackground();
resetGame();

/* ---------- Helpers ---------- */
function makeEmptyGrid() {
  return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
}

function loadBest() {
  const v = Number(localStorage.getItem(BEST_KEY) || "0");
  return Number.isFinite(v) ? v : 0;
}

function saveBest(v) {
  localStorage.setItem(BEST_KEY, String(v));
}

function initBackground() {
  els.bg.innerHTML = "";
  for (let i = 0; i < SIZE * SIZE; i++) {
    const d = document.createElement("div");
    d.className = "cell";
    els.bg.appendChild(d);
  }
}

function emptyCells(g) {
  const out = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (!g[r][c]) out.push([r, c]);
    }
  }
  return out;
}

function anyMovesLeft(g) {
  if (emptyCells(g).length > 0) return true;

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const t = g[r][c];
      if (!t) continue;
      const v = t.value;
      const right = c + 1 < SIZE ? g[r][c + 1] : null;
      const down  = r + 1 < SIZE ? g[r + 1][c] : null;
      if (right && right.value === v) return true;
      if (down && down.value === v) return true;
    }
  }
  return false;
}

function hasValueOnBoard(g, value) {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const t = g[r][c];
      if (t && t.value === value) return true;
    }
  }
  return false;
}

function spawnRandomTile(g) {
  const empties = emptyCells(g);
  if (empties.length === 0) return false;

  const [r, c] = empties[Math.floor(Math.random() * empties.length)];
  const value = Math.random() < 0.9 ? 2 : 4;

  g[r][c] = {
    id: nextTileId++,
    value,
    flags: { isNew: true, isMerged: false },
  };
  return true;
}

/* ---------- Movement core (tile objects keep stable ids) ---------- */
function slideAndMergeLine(tiles) {
  const filtered = tiles.filter(Boolean);

  /** @type {(null|{id:number,value:number,flags:{isNew:boolean,isMerged:boolean}})[]} */
  const out = [];
  let gained = 0;

  for (let i = 0; i < filtered.length; i++) {
    const cur = filtered[i];
    const next = filtered[i + 1];

    if (next && cur.value === next.value) {
      const mergedValue = cur.value * 2;
      gained += mergedValue;

      out.push({
        id: nextTileId++,
        value: mergedValue,
        flags: { isNew: false, isMerged: true },
      });
      i++;
    } else {
      cur.flags.isNew = false;
      cur.flags.isMerged = false;
      out.push(cur);
    }
  }

  while (out.length < SIZE) out.push(null);
  return { line: out, gained };
}

function resetGame() {
  score = 0;
  gameOver = false;
  hasWon = false;
  hideOverlay();

  grid = makeEmptyGrid();
  tileEls.forEach(el => el.remove());
  tileEls.clear();

  spawnRandomTile(grid);
  spawnRandomTile(grid);

  render();
}

/* ---------- Render (smooth slide via CSS vars) ---------- */
function getLayout() {
  const root = getComputedStyle(document.documentElement);
  const size = Number.parseFloat(root.getPropertyValue("--size")) || 92;
  const gap = Number.parseFloat(root.getPropertyValue("--gap")) || 12;
  return { step: size + gap };
}

function tileBackgroundForValue(v) {
  const base = `images/${v}`;
  return `url("${base}.png"), url("${base}.jpg"), url("${base}.jpeg")`;
}

function render() {
  els.score.textContent = String(score);
  els.best.textContent = String(best);

  const { step } = getLayout();
  const seenIds = new Set();

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const t = grid[r][c];
      if (!t) continue;

      seenIds.add(t.id);

      let el = tileEls.get(t.id);
      if (!el) {
        el = document.createElement("div");
        el.className = "tile";
        el.dataset.id = String(t.id);
        els.tiles.appendChild(el);
        tileEls.set(t.id, el);
      }

      el.style.backgroundImage = tileBackgroundForValue(t.value);
      el.textContent = ""; // images-only

      el.classList.toggle("is-new", !!t.flags.isNew);
      el.classList.toggle("is-merged", !!t.flags.isMerged);

      const x = c * step;
      const y = r * step;

      // Set CSS variables; transform reads these vars.
      el.style.setProperty("--tx", `${x}px`);
      el.style.setProperty("--ty", `${y}px`);

      el.setAttribute("aria-label", String(t.value));

      t.flags.isNew = false;
      t.flags.isMerged = false;
    }
  }

  for (const [id, el] of tileEls.entries()) {
    if (seenIds.has(id)) continue;
    el.remove();
    tileEls.delete(id);
  }
}

/* ---------- Move wrapper ---------- */
function move(direction) {
  if (gameOver) return;

  const before = grid.map(row => row.map(t => (t ? t.value : 0)).join(",")).join("|");

  let gainedTotal = 0;
  const newGrid = makeEmptyGrid();

  if (direction === "left" || direction === "right") {
    for (let r = 0; r < SIZE; r++) {
      const row = grid[r].slice();
      const working = direction === "right" ? row.reverse() : row;

      const { line, gained } = slideAndMergeLine(working);
      gainedTotal += gained;

      const out = direction === "right" ? line.reverse() : line;
      newGrid[r] = out;
    }
  } else {
    for (let c = 0; c < SIZE; c++) {
      const col = [];
      for (let r = 0; r < SIZE; r++) col.push(grid[r][c]);

      const working = direction === "down" ? col.reverse() : col;

      const { line, gained } = slideAndMergeLine(working);
      gainedTotal += gained;

      const out = direction === "down" ? line.reverse() : line;
      for (let r = 0; r < SIZE; r++) newGrid[r][c] = out[r];
    }
  }

  const after = newGrid.map(row => row.map(t => (t ? t.value : 0)).join(",")).join("|");
  if (before === after && gainedTotal === 0) return;

  grid = newGrid;

  score += gainedTotal;
  if (score > best) {
    best = score;
    saveBest(best);
  }

  spawnRandomTile(grid);
  render();

  // Win message (once)
  if (!hasWon && hasValueOnBoard(grid, 2048)) {
    hasWon = true;
    showOverlay("You Got Rabbi Joel!", "You reached 2048. Click anywhere to keep playing.");
  }

  if (!anyMovesLeft(grid)) {
    gameOver = true;
    showOverlay("Game over!", "No more moves. Try again?");
  }
}

/* ---------- Overlay ---------- */
function showOverlay(title, msg) {
  els.overTitle.textContent = title;
  els.overMsg.textContent = msg;
  els.overlay.classList.add("show");
}

function hideOverlay() {
  els.overlay.classList.remove("show");
}

/* Click overlay to continue only when it's a win (not game over) */
els.overlay.addEventListener("click", (e) => {
  if (!els.overlay.classList.contains("show")) return;
  if (gameOver) return; // keep blocking on game over
  hideOverlay();
});

/* ---------- Input ---------- */
document.addEventListener("keydown", (e) => {
  const key = e.key.toLowerCase();
  const map = {
    arrowleft: "left", a: "left",
    arrowright: "right", d: "right",
    arrowup: "up", w: "up",
    arrowdown: "down", s: "down",
  };
  const dir = map[key];
  if (!dir) return;
  e.preventDefault();
  move(dir);
});

els.restart.addEventListener("click", resetGame);
els.tryAgain.addEventListener("click", resetGame);

/* Touch swipe */
let touchStart = null;

els.board.addEventListener("touchstart", (e) => {
  if (!e.touches || e.touches.length !== 1) return;
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });

els.board.addEventListener("touchend", (e) => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  touchStart = null;

  const absX = Math.abs(dx);
  const absY = Math.abs(dy);
  const THRESH = 24;
  if (Math.max(absX, absY) < THRESH) return;

  if (absX > absY) move(dx > 0 ? "right" : "left");
  else move(dy > 0 ? "down" : "up");
}, { passive: true });
</script>
</body>
</html>
